[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cynbit-inquiry-copilot"
version = "0.3.0"
description = "An explainable NLP proof of concept for triaging business inquiries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.5,<2.0",
    "streamlit>=1.38,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
